<div style="position: absolute; left: 72px; top: 330px; display: flex; flex-direction: column; gap: 12px; width: 240px">
<a href="Town.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #D9A441; color: #2F3640; border-radius: 12px; font-weight: 700; font-size: 19px; text-decoration: none; box-shadow: 0 3px 0 #a8761f">Play solo

<a href="Lobby.dc.html" style="display: block; padding: 13px 20px; background: rgba(47,54,64,0.92); border: 1px solid rgba(217,164,65,0.55); border-radius: 10px; font-weight: 600; font-size: 17px; text-decoration: none; color: #EDE6D6">Join with a code</a>
</div>

<div style="position: absolute; right: 40px; top: 32px; display: flex; gap: 16px; align-items: center">
<a href="SignIn.dc.html" style="padding: 10px 16px; border-radius: 10px; background: rgba(47,54,64,0.85); border: 1px solid rgba(237,230,214,0.25); font-weight: 600; font-size: 16px; text-decoration: none">Sign in</a>
</div>

<div style="position: absolute; left: 676px; top: 300px; display: flex; flex-direction: column; align-items: flex-start">
<div style="background: #EDE6D6; color: #2F3640; padding: 8px 12px; border-radius: 12px; font-size: 15px; font-weight: 600; box-shadow: 0 2px 0 rgba(0,0,0,0.25)">Bread's 3 coins today. I can afford it.</div>
<svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true" style="margin-left: 132px"><path d="M0 0h18L9 12z" fill="#EDE6D6"/></svg>
</div>

<img src="../assets/char-gus.svg" alt="Greedy Gus, an AI owner in a tall black hat" style="position: absolute; right: 150px; bottom: 26px; width: 180px; height: 279px">
<img src="../assets/char-fern.svg" alt="Fair Fern, an AI owner in a green shawl" style="position: absolute; right: 26px; bottom: 26px; width: 160px; height: 248px">

<p style="position: absolute; left: 72px; bottom: 36px; margin: 0; font-size: 15px; color: #EDE6D6; opacity: 0.85">A game for the NEAR HACKATHON. Ten thousand coins, fixed forever.</p>
