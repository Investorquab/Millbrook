<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Millbrook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Grenze:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EDE6D6}
a:hover{color:#F2C76B}
a:focus-visible,input:focus-visible{outline:2px solid #F2C76B;outline-offset:3px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #27384a; font-family: 'Barlow', sans-serif; color: #EDE6D6">
<img src="../assets/town.svg" alt="" style="position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; filter: blur(3px) brightness(0.55)">

<a href="Main.dc.html" style="position: absolute; left: 40px; top: 32px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" stroke="#EDE6D6" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Back</a>

<div style="position: absolute; left: 470px; top: 150px; width: 500px; box-sizing: border-box; padding: 40px 44px; background: rgba(47,54,64,0.96); border: 1px solid rgba(217,164,65,0.55); border-radius: 18px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 18px 40px rgba(0,0,0,0.35)">
<div style="display: flex; align-items: center; gap: 16px">
<img src="../assets/face-ada.svg" alt="Ada the baker" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid #D9A441">
<h1 style="margin: 0; font-family: 'Grenze', serif; font-weight: 700; font-size: 44px; line-height: 1">Welcome to Millbrook</h1>
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.45; color: #CFC8B8">No wallet needed. We'll email you a link to sign in, and your town keeps its money on NEAR in the background.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="email" style="font-size: 15px; font-weight: 600">Email</label>
<input id="email" type="email" placeholder="you@example.com" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #5c6672; background: #232a32; color: #EDE6D6; font: 500 17px 'Barlow', sans-serif">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="username" style="font-size: 15px; font-weight: 600">Username</label>
<input id="username" type="text" placeholder="The name rivals will see" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #5c6672; background: #232a32; color: #EDE6D6; font: 500 17px 'Barlow', sans-serif">
<span style="font-size: 14px; color: #B9B2A4">Shown on scoreboards, in chat and in the Gazette.</span>
</div>
<a href="Hub.dc.html" style="display: flex; justify-content: center; padding: 15px 20px; background: #D9A441; color: #2F3640; border-radius: 12px; font-weight: 700; font-size: 18px; text-decoration: none; box-shadow: 0 3px 0 #a8761f">Send login link</a>
<p style="margin: 0; font-size: 14px; color: #B9B2A4">Just looking? <a href="Town.dc.html" style="font-weight: 600">Play solo as a guest</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
